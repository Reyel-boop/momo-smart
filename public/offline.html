<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12275e" />
    <title>No internet · Momo Smart</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6fb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #0f172a;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 360px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(18, 39, 94, 0.08);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 22px;
        margin: 16px 0 8px;
      }
      p {
        color: #64748b;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #12275e;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Momo needs the internet to load your lessons and scores. Check your
        Wi-Fi or mobile data, then try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
